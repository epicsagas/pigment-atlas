<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Pigment Atlas</title>
	<style>
		html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
		canvas { display: block; }
		.panel { position: fixed; font: 12px/1.5 ui-monospace, Menlo, monospace; color: #8fa3c7; }
		button { font: inherit; color: inherit; background: #0b1020cc; border: 1px solid #22304d; padding: 4px 10px; cursor: pointer; }
		button { touch-action: manipulation; }
		button:hover { color: #fff; }
		button.on { color: #fff; border-color: #19c6d8; }
		#ui { left: 20px; bottom: 18px; max-width: min(900px, calc(100vw - 40px)); }
		#ui h1 { font-size: 13px; font-weight: 500; margin: 0 0 6px; color: #d8e4ff; letter-spacing: 0.08em; }
		#ui h1 #status { margin-left: 10px; color: #19c6d8; letter-spacing: 0; }
		#themes, #nav { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
		#themes button { font-size: 11px; padding: 3px 8px; opacity: 0.8; }
		#counter { margin-left: 10px; color: #6f83a8; letter-spacing: 0; }
		#index { inset: 0; display: none; overflow: auto; background: #000d; padding: 64px 24px 24px; box-sizing: border-box; }
		#index.open { display: block; }
		#help, #index { z-index: 10; }
		#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
		#grid h2 { font-size: 12px; font-weight: 500; color: #19c6d8; margin: 0 0 6px; }
		#grid button { display: block; width: 100%; text-align: left; margin-bottom: 3px; background: #0b1020; }
		#ref { margin: 8px 0 0; color: #c3d0ea; }
		#note { margin: 2px 0 0; opacity: 0.55; }
		#tools { top: 16px; right: 20px; display: flex; gap: 6px; align-items: center; z-index: 11; }
		#touch { display: none; gap: 4px; margin-bottom: 6px; }
		#tools a { display: flex; color: inherit; }
		#tools a svg { width: 19px; height: 19px; fill: #8fa3c7; }
		#tools a:hover svg { fill: #fff; }
		#help { inset: 0; display: none; place-items: center; background: #000a; }
		#help.open { display: grid; }
		#help dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 0; padding: 20px 26px; background: #0b1020ee; border: 1px solid #22304d; }
		#help dt { color: #19c6d8; text-align: right; }
		#help dd { margin: 0; color: #d8e4ff; }
		body.hide-ui #ui, body.hide-ui #tools > :not(#uiToggle) { display: none; }
		#uiToggle { transition: opacity 0.4s; }
		body.hide-ui #uiToggle { opacity: 0.25; background: transparent; border-color: transparent; padding: 2px 6px; font-size: 14px; }
		body.hide-ui.pointer #uiToggle { opacity: 0.45; }
		body.hide-ui #uiToggle:hover { opacity: 0.9; }
		body.hide-ui:not(.pointer) { cursor: none; }
		#toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); font: 13px/1.4 ui-monospace, Menlo, monospace; color: #d8e4ff; letter-spacing: 0.06em; background: #0006; padding: 6px 14px; opacity: 0; transition: opacity 0.5s; pointer-events: none; }
		#toast.show { opacity: 1; }
		/* Touch devices: no keyboard, so expose the shortcut-only actions as buttons and drop the shortcut help. */
		@media (hover: none) {
			#touch { display: flex; }
			#helpBtn { display: none; }
			#tools button, #touch button { min-width: 40px; min-height: 36px; }
			body.hide-ui #uiToggle { opacity: 0.5; min-width: 44px; min-height: 44px; }
		}
		/* Narrow screens: icon-only top bar, single scrollable rows at the bottom, safe-area insets. */
		@media (max-width: 640px) {
			#tools { top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); }
			#tools .label { display: none; }
			#ui { left: calc(10px + env(safe-area-inset-left)); right: calc(10px + env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom)); max-width: none; }
			#themes, #nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
			#themes button, #nav button { flex: none; }
			#ref { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
			#note { display: none; }
			#index { padding: calc(60px + env(safe-area-inset-top)) 12px 12px; }
			#toast { bottom: calc(24px + env(safe-area-inset-bottom)); }
		}
	</style>
</head>
<body>
	<div id="ui" class="panel">
		<h1>PIGMENT ATLAS<span id="counter"></span><span id="status"></span></h1>
		<div id="touch"><button id="prevBtn">‹</button><button id="nextBtn">›</button><button id="pauseBtn"></button><button id="tourBtn">↻</button><button id="resetBtn">⌖</button></div>
		<div id="themes"></div>
		<div id="nav"></div>
		<p id="ref"></p>
		<p id="note"></p>
	</div>
	<div id="tools" class="panel">
		<a href="https://github.com/epicsagas/pigment-atlas" target="_blank" rel="noopener" aria-label="GitHub repository"><svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
		<button id="indexBtn"></button>
		<button id="helpBtn"></button>
		<button id="lang"></button>
		<button id="fs"></button>
		<button id="uiToggle"></button>
	</div>
	<div id="toast"></div>
	<div id="help" class="panel"><dl id="keys"></dl></div>
	<div id="index" class="panel"><div id="grid"></div></div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
